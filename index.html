<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="JH Project / JuneHyuk Cho — 게임제작과정 및 논문 투고과정을 프로젝트로서 기록합니다."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      글꼴은 영문 하나에 한글 하나를 짝지어 씁니다.
      영문 글꼴에는 한글이 없어서, 한글 글자만 자동으로 짝에게 넘어갑니다.

        제목·인용 (세리프)  Times New Roman  ↔  나눔명조
                            둘 다 획의 굵기 차이가 뚜렷한 고전 활자입니다.
        본문 (산세리프)     Source Sans 3    ↔  Paperlogy
        제목의 한글                          ↔  Paperlogy
                            각지고 개성이 뚜렷한 현대 한글 활자입니다.
                            제목도 본문도 한 벌로 통일해, 한글만 따로 노는 일이 없습니다.
        라벨 (모노)         IBM Plex Mono    ↔  Paperlogy
                            한글에는 고정폭 활자가 마땅치 않아 본문 짝을 씁니다.

      Tinos 는 Times New Roman 이 없는 기기를 위한 같은 폭의 대체 글꼴입니다.
      모두 필요한 글자 조각만 내려받아 용량 부담이 적습니다.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <style>
      /* Paperlogy — 눈누 무료 글꼴 (상업적 사용 가능) */
      @font-face {
        font-family: 'Paperlogy';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-3Light.woff2')
          format('woff2');
        font-weight: 300;
        font-display: swap;
      }
      @font-face {
        font-family: 'Paperlogy';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2')
          format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'Paperlogy';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2')
          format('woff2');
        font-weight: 500;
        font-display: swap;
      }
      @font-face {
        font-family: 'Paperlogy';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2')
          format('woff2');
        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: 'Paperlogy';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2')
          format('woff2');
        font-weight: 700;
        font-display: swap;
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&family=Source+Sans+3:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>JH Project · JuneHyuk Cho — Games &amp; Papers</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
