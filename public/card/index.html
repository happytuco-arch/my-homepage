  :root {
    --ink: #16202e;
    --muted: #5b6676;
    --blue: #2457d6;
    --line: #e3e7ef;
    --bg: #f3f5f9;
    --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Source Sans 3", "Source Sans Pro", "Segoe UI", -apple-system, system-ui, sans-serif;
  }
  .card {
    width: min(420px, 100%);
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 1px 2px rgb(22 32 46 / .06), 0 18px 48px rgb(22 32 46 / .10);
    padding: 40px 32px 28px;
    position: relative;
    overflow: hidden;
  }
  /* 뒷면의 옅은 타원 장식 */
  .card::after {
    content: "";
    position: absolute;
    right: -130px; top: 150px;
    width: 300px; height: 120px;
    border: 1px solid var(--line);
    border-radius: 50%;
    transform: rotate(-35deg);
    pointer-events: none;
  }
  .rule { width: 40px; height: 3px; background: var(--blue); }
  h1 { margin-top: 22px; font-size: 34px; font-weight: 600; letter-spacing: -.01em; line-height: 1.1; }
  .ko { margin-top: 6px; font-size: 15px; color: var(--muted); }
  .role { margin-top: 14px; font-size: 19px; color: var(--blue); }
  .org { margin-top: 4px; font-size: 16px; color: var(--muted); }

  .links { margin-top: 28px; display: grid; gap: 10px; position: relative; z-index: 1; }
  .links a {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--ink);
    text-decoration: none;
    font-size: 16px;
    transition: border-color .15s, background .15s;
  }
  .links a:hover { border-color: var(--blue); background: #f6f8fe; }
  .links svg { width: 20px; height: 20px; flex: none; stroke: var(--blue); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .links small { margin-left: auto; color: var(--muted); font-size: 13px; }
  .links a.primary { background: var(--blue); border-color: var(--blue); color: #fff; justify-content: center; font-weight: 600; }
  .links a.primary svg { stroke: #fff; }
  .links a.primary:hover { background: #1d48b5; }

  /* 학회에서 화면을 보여 주면 상대가 찍는 QR */
  .qr { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); text-align: center; }
  .qr .box { display: inline-block; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
  .qr svg { display: block; width: 168px; height: 168px; }
  .qr p { margin-top: 10px; font-size: 13px; color: var(--muted); }
</style>
