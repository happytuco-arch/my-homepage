<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JuneHyuk Cho — Card</title>
<meta name="description" content="JuneHyuk Cho · Game Design & Research · Sungkyunkwan University">
<meta property="og:title" content="JuneHyuk Cho">
<meta property="og:description" content="Game Design & Research · Sungkyunkwan University">
<meta name="theme-color" content="#eef1f6">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /*
   * 디지털 명함 — Figma 명함(명함-앞/뒤.png)을 영어로 옮긴 것.
   * 앞·뒷면 배치는 원본 2126×1182 기준 비율을 cqw 단위로 그대로 옮겼습니다.
   * 탭하면 앞면 ↔ 뒷면이 뒤집힙니다.
   */
  :root {
    --ink: #1b2330;
    --muted: #5b6676;
    --blue: #2457d6;
    --line: #e3e7ef;
    --bg: #eef1f6;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 28px 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Source Sans 3", "Source Sans Pro", "Segoe UI", system-ui, sans-serif;
  }

  /* ── 뒤집히는 명함 ── */
  .flip {
    width: min(560px, 100%);
    aspect-ratio: 2126 / 1182;
    perspective: 1400px;
    cursor: pointer;
    border: 0; padding: 0; background: none;
    font: inherit; color: inherit; text-align: left;
  }
  .flip__inner {
    position: relative;
    width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform .7s cubic-bezier(.2,.7,.2,1);
  }
  .flip[aria-pressed="true"] .flip__inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    container-type: inline-size;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 1px 2px rgb(27 35 48 / .06), 0 20px 50px rgb(27 35 48 / .12);
    backface-visibility: hidden;
    overflow: hidden;
  }
  .face--back { transform: rotateY(180deg); }

  /* 원본 좌표(2000px 폭 기준) ÷ 20 = cqw */
  .rule { position: absolute; left: 9cqw; top: 9cqw; width: 5.3cqw; height: .25cqw; background: var(--blue); }
  .name { position: absolute; left: 9cqw; top: 12.6cqw; font-size: 5.6cqw; font-weight: 700; letter-spacing: -.01em; }
  .role { position: absolute; left: 9cqw; top: 20.4cqw; font-size: 2.9cqw; color: var(--blue); }
  .org  { position: absolute; left: 9cqw; top: 41.6cqw; font-size: 3.4cqw; color: var(--muted); }
  .leaf { position: absolute; left: 79.8cqw; top: 38cqw; width: 6.2cqw; }
  .mail { position: absolute; left: 9cqw; top: 36.6cqw; font-size: 3.4cqw; font-weight: 600; }
  .url  { position: absolute; left: 9cqw; top: 42.6cqw; font-size: 2.9cqw; color: var(--blue); }
  /* 학교 로고 — 원본 jpg 의 흰 여백을 잘라 내고 오른쪽 위에 둡니다 */
  .logo { position: absolute; right: 8cqw; top: 7cqw; width: 15cqw; aspect-ratio: 1; overflow: hidden; }
  .logo img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.75); transform-origin: 50% 48%; }
  .orbit { position: absolute; left: 50cqw; top: 13cqw; width: 36cqw; }

  .hint { font-size: 13px; color: var(--muted); letter-spacing: .02em; }

  /* ── 버튼 · QR ── */
  .actions { width: min(560px, 100%); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions a {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
    text-decoration: none;
    font-size: 15px;
  }
  .actions a.primary { grid-column: 1 / -1; background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
  .actions svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .qr { text-align: center; }
  .qr img { display: block; width: 132px; height: 132px; padding: 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  .qr p { margin-top: 8px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <button class="flip" type="button" aria-pressed="false" aria-label="Business card — tap to flip">
    <div class="flip__inner">
      <!-- 앞면 -->
      <div class="face face--front">
        <span class="rule"></span>
        <p class="name">JuneHyuk Cho</p>
        <p class="role">Game Design &amp; Research</p>
        <p class="org">Sungkyunkwan University</p>
        <span class="logo"><img src="/images/skku-logo.jpg" alt="Sungkyunkwan University logo"></span>
        <svg class="leaf" viewBox="0 0 120 125" fill="none" stroke="#2457d6" stroke-width="3">
          <path d="M104 4C80 0 52 2 32 14 10 28 0 58 6 84c6 24 26 38 48 36 26-2 48-22 56-50 6-22 2-46-6-66Z"/>
        </svg>
      </div>
      <!-- 뒷면 -->
      <div class="face face--back">
        <span class="rule"></span>
        <svg class="orbit" viewBox="0 0 660 540" fill="none" stroke="#d3d9e6" stroke-width="2">
          <ellipse cx="330" cy="270" rx="340" ry="120" transform="rotate(-36 330 270)"/>
          <ellipse cx="330" cy="270" rx="230" ry="95" transform="rotate(-24 330 270)"/>
        </svg>
        <p class="mail">happytuco@g.skku.edu</p>
        <p class="url">my-homepage-pi-wheat.vercel.app</p>
      </div>
    </div>
  </button>
  <p class="hint">Tap the card to flip</p>

  <nav class="actions">
    <a class="primary" href="/card/junehyuk-cho.vcf" download>
      <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>
      Save contact
    </a>
    <a href="mailto:happytuco@g.skku.edu">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      Email
    </a>
    <a href="https://my-homepage-jh-f22e.vercel.app/">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"/></svg>
      Portfolio
    </a>
  </nav>

  <div class="qr">
    <img src="/card/qr.svg" alt="QR code for this card">
    <p>Scan to share this card</p>
  </div>

  <script>
    const flip = document.querySelector('.flip')
    flip.addEventListener('click', () => {
      flip.setAttribute('aria-pressed', flip.getAttribute('aria-pressed') === 'true' ? 'false' : 'true')
    })
  </script>
</body>
</html>
